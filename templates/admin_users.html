<!DOCTYPE html>
<html>
<head>
    <title>Admin User Management</title>
</head>
<body>
    <h1>Admin Users</h1>
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th><th>Username</th><th>Reg Number</th><th>Email</th><th>Department</th><th>Role</th><th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user['id'] }}</td>
                <td>{{ user['username'] }}</td>
                <td>{{ user['reg_number'] }}</td>
                <td>{{ user['email'] }}</td>
                <td>{{ user['department'] }}</td>
                <td>{{ user['role'] }}</td>
                <td>
                    <a href="{{ url_for('edit_admin_user', user_id=user['id']) }}">Edit</a> |
                    <a href="{{ url_for('delete_admin_user', user_id=user['id']) }}" onclick="return confirm('Are you sure you want to delete this user?');">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{{ url_for('register') }}">Add New Admin User</a> |
    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</body>
</html>
