{% extends "base.html" %}

{% block title %}Add RFID Tag{% endblock %}

{% block content %}
<h2 style="text-align: center; font-size: 28px; margin-bottom: 30px;">Add RFID Tag</h2>

<div style="display: flex; justify-content: center; align-items: center; height: 75vh;">
    <form method="POST" 
          style="background: #ecf0f1; padding: 40px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.15); width: 400px;">

        <input 
            type="text" 
            name="tag_value" 
            placeholder="Enter RFID Tag Value" 
            required
            style="width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">

        <input 
            type="text" 
            name="description" 
            placeholder="Enter Description (optional)"
            style="width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">

        <label style="font-weight: 600; margin-bottom: 6px; display: block;">Select Status:</label>
        <select 
            name="status" 
            style="width: 100%; padding: 12px; margin-bottom: 25px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
        </select>

        <div style="display: flex; justify-content: space-between;">
            <button type="submit" 
                style="background-color: #3498db; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; cursor: pointer;">
                Save Tag
            </button>

           
        </div>

    </form>
</div>
{% endblock %}
