{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<h2 style="text-align: center; font-size: 28px; margin-bottom: 30px;">Change Password</h2>

<div style="display: flex; justify-content: center; align-items: center; height: 75vh;">
    <form method="POST" 
          style="background: #ecf0f1; padding: 40px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.15); width: 400px;">

        <input 
            type="password"
            name="current_password" 
            placeholder="Enter Current Password" 
            required 
            style="width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">

        <input 
            type="password"
            name="new_password" 
            placeholder="Enter New Password" 
            required 
            style="width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">

        <input 
            type="password"
            name="confirm_password" 
            placeholder="Confirm New Password" 
            required 
            style="width: 100%; padding: 15px; margin-bottom: 25px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">

        <button type="submit" 
            style="background-color: #3498db; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; cursor: pointer;">
            Change Password
        </button>
    </form>
</div>
{% endblock %}
