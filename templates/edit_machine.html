{% extends "base.html" %}

{% block title %}Edit Machine{% endblock %}

{% block content %}
<h2 style="text-align: center; font-size: 28px; margin-bottom: 30px;">Edit Machine</h2>

<div style="display: flex; justify-content: center; align-items: center; height: 75vh;">
    <form method="POST" style="background: #ecf0f1; padding: 40px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.15); width: 400px;">

        <input
            name="machine_id"
            value="{{ machine['machine_id'] }}"
            placeholder="Enter Machine ID"
            required
            style="width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;"
        >

        <input
            name="description"
            value="{{ machine['description'] }}"
            placeholder="Enter Description of the Machine"
            required
            style="width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;"
        >

        <select
            id="user_id"
            name="user_id"
            required
            class="select2"
            style="width: 100%; padding: 12px; margin-bottom: 40px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;"
        >
            <option value="" disabled>Select User</option>
            {% for user in users %}
                <option value="{{ user['id'] }}" {% if user['id'] == machine['user_id'] %}selected{% endif %}>
                    {{ user['full_name'] }}
                </option>
            {% endfor %}
        </select>

        <select
            id="rfid_tag_id"
            name="rfid_tag_id"
            required
            class="select2"
            style="width: 100%; padding: 12px; margin-bottom: 25px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;"
        >
            <option value="" disabled>Select RFID Tag</option>
            {% for tag in available_tags %}
                <option value="{{ tag['id'] }}" {% if tag['id'] == machine['rfid_tag_id'] %}selected{% endif %}>
                    {{ tag['tag_value'] }} - {{ tag['description'] }}
                </option>
            {% endfor %}
        </select>

        <div style="display: flex; justify-content: space-between;">
            <button type="submit"
                style="background-color: #3498db; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; cursor: pointer;">
                Update Machine
            </button>

            <a href="{{ url_for('view_machines') }}"
                style="background-color: #3498db; color: white; text-decoration: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; display: inline-block; text-align: center;">
                Cancel
            </a>
        </div>

    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<script>
    document.addEventListener('DOMContentLoaded', function () {
        $('.select2').select2({
            width: '100%',
            placeholder: function(){
                var element = $(this);
                var placeholder = element.data('placeholder');
                return placeholder || 'Please select an option';
            },
            allowClear: true
        });
    });
</script>

{% endblock %}
