<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Edit Role for {{ user[1] }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f8;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #3498db;
        }
        form {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: bold;
            font-size: 1.1em;
        }
        select {
            padding: 8px 12px;
            font-size: 1em;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 150px;
            padding: 10px;
            background-color: #27ae60;
            color: white;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            align-self: center;
        }
        button:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>
    <h2>Edit Role for {{ user[1] }}</h2>
    <form method="POST" action="{{ url_for('edit_update_staff_role', user_id=user[0]) }}">
        <label for="role">Select New Role:</label>
        <select name="role" id="role" required>
            <option value="admin" {% if user[5] == 'admin' %}selected{% endif %}>Admin</option>
            <option value="lab_assistant" {% if user[5] == 'lab_assistant' %}selected{% endif %}>Lab Assistant</option>
        </select>
        <button type="submit">Update Role</button>
    </form>
</body>
</html>
