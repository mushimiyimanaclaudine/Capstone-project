{% extends "base.html" %}

{% block title %}Register User{% endblock %}

{% block content %}
<h2 style="text-align: center; font-size: 28px; margin-bottom: 30px;">Register User</h2>

<div style="display: flex; justify-content: center;">
  <form method="POST" action="{{ url_for('register') }}"
        id="registerForm"
        style="background: #ecf0f1; padding: 30px 40px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.15); width: 450px;">

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Username -->
    <label for="username">Username:</label>
    <input name="username" required placeholder="Enter Username"
           style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;" />

    <!-- Phone number -->
<label for="phone_number">Phone Number (optional):</label>
<input
    name="phone_number"
    placeholder="Enter Phone Number (10 digits)"
    pattern="^\d{10}$"
    title="Phone number must be exactly 10 digits if provided"
    style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;"
/>


    <!-- Email (Optional) -->
    <label for="email">Email (optional):</label>
    <input name="email" type="email" placeholder="Enter Email Address"
           style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;" />

    <!-- Department (Optional) -->
    <label for="department">Department (optional):</label>
    <input name="department" placeholder="Enter Department"
           style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;" />
<!-- Role -->
<label for="role">Role:</label>
<select name="role" required
        style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">
  <option value="">-- Select Role --</option>
  <option value="lab_assistant">Lab Assistant</option>
  <option value="admin">Admin</option>
</select>


    <!-- Password -->
    <label for="password">Password:</label>
    <input name="password" type="password" required minlength="6" placeholder="Enter Password"
           style="width: 100%; padding: 12px; margin-bottom: 25px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;" />

    <!-- Submit Button -->
    <div style="display: flex; justify-content: center;">
      <button type="submit"
              style="background-color: #3498db; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; cursor: pointer;">
        Register User
      </button>
    </div>
  </form>
</div>

<script>
  (() => {
    'use strict';
    const form = document.getElementById('registerForm');
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
      }
      form.classList.add('was-validated');
    }, false);
  })();
</script>
{% endblock %}
